name: Feature request / Vorschlag melden
description: Suggest an improvement, balancing change, or new AdjustSuite module. | Schlagen Sie eine Verbesserung, eine Anpassung der Balance oder ein neues AdjustSuite-Modul vor.
title: "[Feature | Funktion]: "
labels: ["enhancement | Verbesserung"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement for AdjustSuite. | Danke für deinen Vorschlag für AdjustSuite.

  - type: textarea
    id: summary
    attributes:
      label: Summary | Zusammenfassung
      description: Give the request a short, clear summary. | Bitte fassen Sie die Anfrage kurz und verständlich zusammen.
      placeholder: "Add an option to ... | Eine Option hinzufügen, um …"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case | Problem oder Anwendungsfall
      description: What situation should this solve? | Welche Situation soll damit gelöst werden?
      placeholder: "I want to ... but currently ... | Ich möchte …, aber im Moment …"
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution | Lösungsvorschlag
      description: Describe the behavior or option you would like to see. | Beschreiben Sie das gewünschte Verhalten oder die gewünschte Option.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area | Bereich
      description: Which area does this request affect? | Welchen Bereich betrifft diese Anfrage?
      options:
        - AFV - Adjust Fill Volume - Füllvolumen
        - AMP - Adjust Motor Power - Motorleistung
        - AWS - Adjust Working Speed - Arbeitsgeschwindigkeit
        - AWW - Adjust Working Width - Arbeitsbreite
        - APW - Adjust Pickup Width	- Pickupbreite
        - ADS - Adjust Driving Speed - Fahrgeschwindigkeit
        - ABP - Adjust Brake Power - Bremskraft
        - ADR - Adjust Discharge Rate - Entladerate
        - New module | Neues Modul
        - Core / settings / help menu | Kern / Einstellungen / Preise / Hilfemenü
        - Documentation / release notes | Dokumentation / Versionshinweise
        - Other | Sonstiges
    validations:
      required: true

  - type: textarea
    id: balancing
    attributes:
      label: Balancing notes | Anmerkungen zur Balance
      description: If this changes values, ranges, prices, or gameplay balance, explain the expected limits. | Falls sich dadurch Werte, Bereiche, Preise oder die Spielbalance ändern, erläutern Sie bitte die zu erwartenden Grenzen.
      placeholder: "Example: Real mode should stay within +/-20% ... | Beispiel: Der Real-Modus sollte innerhalb von +/-20 % bleiben …"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered | In Betracht gezogene Alternativen
      description: Are there workarounds or different designs you considered? | Gibt es Alternativen oder andere Entwürfe, die Sie in Betracht gezogen haben?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one. | Bevor ich dieses Ticket eröffnet habe, habe ich nach bereits bestehenden Tickets gesucht.
          required: true
        - label: This request fits the goal of AdjustSuite and is not specific to only one private savegame setup. | Diese Anfrage entspricht dem Ziel von AdjustSuite und bezieht sich nicht ausschließlich auf eine bestimmte private Spielstandskonfiguration.
          required: true
